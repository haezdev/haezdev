<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Video</title>

<meta property="og:type" content="video.other">
<meta property="og:title" content="Video">
<meta property="og:video" content="video.mp4">
<meta property="og:video:secure_url" content="video.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="720">
<meta property="og:video:height" content="1280">
<meta property="og:image" content="poster.jpg">

<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{
    display:grid; place-items:center;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #player{
    width:100%; height:100%; max-height:100dvh;
    object-fit:contain; background:#000; display:block;
  }

  #bunyi{
    position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:6; display:none; align-items:center; gap:8px;
    padding:10px 18px; border:0; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,.94); color:#111;
    font-size:14px; font-weight:600; letter-spacing:.01em;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
    animation: naik .28s ease-out both;
  }
  #bunyi.show{ display:inline-flex; }
  #bunyi svg{ width:18px; height:18px; fill:#111; flex:0 0 auto; }
  @keyframes naik{ from{ opacity:0; transform:translate(-50%,10px);} to{ opacity:1; transform:translate(-50%,0);} }

  #muat{
    position:fixed; inset:0; display:grid; place-items:center; z-index:4;
    color:#8b95a3; font-size:12px; letter-spacing:.14em; pointer-events:none;
    transition:opacity .3s ease;
  }
  #muat.sorok{ opacity:0; }
</style>
</head>
<body>
  <video id="player"
         src="video.mp4"
         poster="poster.jpg"
         controls
         autoplay
         muted
         playsinline
         webkit-playsinline
         preload="auto"
         controlslist="nodownload"
         disablepictureinpicture></video>

  <div id="muat">MEMUATKAN…</div>

  <button id="bunyi" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <span>Ketik untuk bunyi</span>
  </button>

<script>
(function(){
  var v     = document.getElementById('player'),
      bunyi = document.getElementById('bunyi'),
      muat  = document.getElementById('muat'),
      hidup = false;

  function kemasBunyi(){
    if (v.muted) { bunyi.classList.add('show'); }
    else { bunyi.classList.remove('show'); }
  }

  /* Hidupkan bunyi serta-merta pada SEBARANG sentuhan / scroll / kekunci */
  function bunyikan(){
    if (hidup) return;
    hidup = true;
    v.muted  = false;
    v.volume = 1;
    var p = v.play();
    if (p && typeof p.catch === 'function') p.catch(function(){ v.muted = true; hidup = false; });
    kemasBunyi();
  }

  function main(){
    v.muted = true;
    var p = v.play();
    if (p && typeof p.then === 'function') {
      p.then(function(){ muat.classList.add('sorok'); kemasBunyi(); })
       .catch(function(){ muat.classList.add('sorok'); kemasBunyi(); });
    }
  }

  bunyi.addEventListener('click', function(e){ e.stopPropagation(); bunyikan(); });

  var isyarat = ['pointerdown','touchstart','mousedown','keydown','scroll','wheel','touchend'];
  isyarat.forEach(function(ev){
    document.addEventListener(ev, bunyikan, { passive:true });
    window.addEventListener(ev, bunyikan, { passive:true });
  });

  v.addEventListener('volumechange', kemasBunyi);
  v.addEventListener('loadeddata',   function(){ muat.classList.add('sorok'); });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && v.paused && !v.ended) main();
  });

  main();
})();
</script>
</body>
</html>
