<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08131f">
<title>Jemputan</title>
<!-- build:12 -->

<meta property="og:type" content="video.other">
<meta property="og:title" content="Jemputan">
<meta property="og:video" content="video.mp4">
<meta property="og:video:secure_url" content="video.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="720">
<meta property="og:video:height" content="1280">
<meta property="og:image" content="poster.jpg">

<style>
  :root{
    color-scheme: dark;
    --emas:#d7b25a;
    --emas-cerah:#f3dfa0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#08131f; }
  body{
    font-family:"Georgia","Times New Roman",serif;
    display:grid; place-items:center;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* ================= VIDEO (belakang) ================= */
  #player{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:contain; background:#000;
    opacity:0; transition:opacity .7s ease;
    z-index:1;
  }
  body.main #player{ opacity:1; }

  /* ================= PINTU: SAMPUL SURAT ================= */
  #pintu{
    position:fixed; inset:0; z-index:3;
    display:grid; align-content:center; justify-items:center;
    gap:clamp(26px,5vh,46px);
    border:0; padding:0; cursor:pointer;
    background:
      radial-gradient(circle at 50% 38%, #173755 0%, #0d2137 46%, #08131f 78%);
    transition:opacity .7s ease;
  }
  body.main #pintu{ opacity:0; pointer-events:none; }

  /* bintang halus pada latar plain */
  #pintu::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 18% 22%, rgba(243,223,160,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 16%, rgba(243,223,160,.32) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 64%, rgba(243,223,160,.38) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 12% 72%, rgba(243,223,160,.28) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 82%, rgba(243,223,160,.35) 50%, transparent 51%);
    animation: kelipBintang 5.5s ease-in-out infinite alternate;
  }
  @keyframes kelipBintang{ from{ opacity:.45; } to{ opacity:1; } }

  /* ============ SAMPUL ============ */
  .sampul{
    position:relative;
    width:min(74vw,300px);
    aspect-ratio:0.80;
    perspective:1100px;
    transition:transform 1s cubic-bezier(.4,0,.2,1), opacity .6s ease;
  }
  body.naik .sampul{ transform:translateY(-2%) scale(1.02); }

  /* badan belakang sampul */
  .env-back{
    position:absolute; inset:0; z-index:1;
    border-radius:12px;
    background:linear-gradient(160deg,#1c4168 0%,#123152 45%,#0a1d33 100%);
    border:1px solid rgba(215,178,90,.55);
    box-shadow:0 28px 70px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.3) inset,
               0 0 60px rgba(215,178,90,.10);
  }

  /* surat di dalam sampul */
  .kad{
    position:absolute; left:8%; right:8%; top:10%; height:72%;
    z-index:2;
    border-radius:7px;
    background-color:#0b1a33;
    background-image:url("poster.jpg");
    background-position:center top;
    background-size:cover;
    background-repeat:no-repeat;
    border:1px solid rgba(215,178,90,.45);
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    transform:translateY(20%);
    opacity:0;
    transition:transform 1.25s cubic-bezier(.22,.61,.36,1), opacity .5s ease .1s;
    will-change:transform, opacity;
  }
  body.naik .kad{ transform:translateY(-46%); opacity:1; }
  body.zoom .kad{ transform:translateY(-46%) scale(3.1); }

  /* poket depan sampul (surat keluar dari belakang ni) */
  .env-front{
    position:absolute; inset:0; z-index:3; border-radius:12px;
    background:linear-gradient(180deg,#1a3d63 0%,#133152 40%,#0b2038 100%);
    clip-path:polygon(0 30%, 50% 62%, 100% 30%, 100% 100%, 0 100%);
    box-shadow:0 -2px 14px rgba(0,0,0,.35) inset;
  }
  /* garis lipatan */
  .env-line{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:
      linear-gradient(35deg, transparent 49.6%, rgba(215,178,90,.22) 50%, transparent 50.4%),
      linear-gradient(-35deg, transparent 49.6%, rgba(215,178,90,.22) 50%, transparent 50.4%);
    border-radius:12px;
  }

  /* flap atas */
  .flap{
    position:absolute; left:0; right:0; top:0; height:56%; z-index:5;
    background:linear-gradient(180deg,#215081 0%,#173c62 55%,#0f2b47 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform .9s cubic-bezier(.5,0,.2,1), filter .9s ease;
    backface-visibility:hidden;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
  }
  body.buka .flap{
    transform:rotateX(-176deg);
    filter:drop-shadow(0 -6px 14px rgba(0,0,0,.25));
  }
  .flap::after{
    content:""; position:absolute; inset:0;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    background:linear-gradient(180deg, rgba(215,178,90,.16), rgba(215,178,90,0) 42%);
  }

  /* meterai lilin emas */
  .seal{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:clamp(58px,15vw,70px); height:clamp(58px,15vw,70px);
    z-index:6; border-radius:50%;
    display:grid; place-items:center;
    background:radial-gradient(circle at 34% 28%, #f7ecc0 0%, #d7b25a 42%, #a9822b 72%, #7d5f18 100%);
    border:1px solid rgba(255,244,205,.75);
    box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 34px rgba(215,178,90,.42),
               inset 0 1px 3px rgba(255,255,255,.55);
    transition:opacity .45s ease, transform .45s ease;
    animation:denyutSeal 2.8s ease-in-out infinite;
  }
  @keyframes denyutSeal{
    0%,100%{ box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 26px rgba(215,178,90,.34), inset 0 1px 3px rgba(255,255,255,.55); }
    50%    { box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 52px rgba(215,178,90,.62), inset 0 1px 3px rgba(255,255,255,.55); }
  }
  .seal svg{ width:46%; height:46%; fill:none; stroke:#4a3708; stroke-width:1.6; }
  body.buka .seal{ opacity:0; transform:translate(-50%,-50%) scale(.6) rotate(-18deg); }

  /* teks arahan */
  #arahan{
    position:relative; z-index:2;
    text-align:center; color:var(--emas-cerah);
    font-size:clamp(13px,3.6vw,15px);
    letter-spacing:.2em; text-transform:uppercase;
    text-shadow:0 2px 14px rgba(0,0,0,.8);
    animation:hayun 2.6s ease-in-out infinite;
    transition:opacity .4s ease;
  }
  #arahan small{
    display:block; margin-top:9px; font-size:12px; letter-spacing:.1em;
    color:rgba(243,223,160,.78); text-transform:none;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @keyframes hayun{
    0%,100%{ opacity:.75; transform:translateY(0); }
    50%    { opacity:1;   transform:translateY(-4px); }
  }
  body.buka #arahan{ opacity:0; }

  /* kilat emas masa surat keluar */
  #kilat{
    position:fixed; inset:0; z-index:7; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(255,242,205,.34), rgba(255,242,205,0) 60%);
  }
  #kilat.on{ animation:kilat .75s ease-out forwards; }
  @keyframes kilat{
    0%{ opacity:0; } 20%{ opacity:1; } 100%{ opacity:0; }
  }
</style>
</head>
<body>

  <video id="player"
         src="video.mp4"
         poster="poster.jpg"
         controls
         playsinline
         webkit-playsinline
         preload="auto"
         controlslist="nodownload"
         disablepictureinpicture></video>

  <button id="pintu" type="button" aria-label="Buka jemputan">

    <div class="sampul" id="sampul">
      <div class="env-back"></div>
      <div class="kad" id="kad"></div>
      <div class="env-front"></div>
      <div class="env-line"></div>
      <div class="flap"></div>
      <div class="seal">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8.5l8 5.2 8-5.2"/>
          <rect x="3" y="5.4" width="18" height="13.2" rx="1.8"/>
        </svg>
      </div>
    </div>

    <div id="arahan">
      Klik untuk buka jemputan
      <small>Kad jemputan digital</small>
    </div>
  </button>

  <div id="kilat"></div>

<script>
(function(){
  var v      = document.getElementById('player'),
      pintu  = document.getElementById('pintu'),
      kilat  = document.getElementById('kilat'),
      badan  = document.body,
      mula   = false;

  function mainVideo(){
    v.muted  = false;
    v.volume = 1;
    badan.classList.add('main');
    var p = v.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function(){
        v.muted = true;
        v.play().catch(function(){});
        tunjukBunyi();
      });
    }
  }

  function bukaSampul(){
    if (mula) return;
    mula = true;

    badan.classList.add('buka');                    // meterai pecah + flap terbuka
    setTimeout(function(){ badan.classList.add('naik'); kilat.classList.add('on'); }, 480);
    setTimeout(function(){ badan.classList.add('zoom'); }, 1020);
    setTimeout(function(){ kilat.classList.remove('on'); }, 1250);
    setTimeout(mainVideo, 1500);                    // surat penuh skrin -> video + bunyi
  }

  function tunjukBunyi(){
    if (document.getElementById('bunyiLagi')) return;
    var b = document.createElement('button');
    b.id = 'bunyiLagi';
    b.textContent = '🔊 Klik untuk bunyi';
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:11px 20px;border:0;border-radius:999px;background:rgba(255,255,255,.95);color:#111;font:600 14px system-ui,sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.45);cursor:pointer';
    b.onclick = function(){ v.muted = false; v.volume = 1; v.play().catch(function(){}); b.remove(); };
    document.body.appendChild(b);
  }

  pintu.addEventListener('click', bukaSampul);
  pintu.addEventListener('touchend', function(e){ e.preventDefault(); bukaSampul(); }, { passive:false });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bukaSampul(); }
  });
})();
</script>
</body>
</html>
