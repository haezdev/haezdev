<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Video</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow:hidden; }
  body{
    display:grid; place-items:center;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #player{
    width:100%; height:100%; max-height:100dvh;
    object-fit:contain; background:#000; display:block;
  }
  /* Lapisan tuding-main: keluar bila autoplay disekat pelayar */
  #tap{
    position:fixed; inset:0; z-index:5; display:none; place-items:center;
    background:rgba(0,0,0,.42); border:0; cursor:pointer;
  }
  #tap.show{ display:grid; }
  #tap .bulat{
    width:96px; height:96px; border-radius:50%;
    background:rgba(255,255,255,.94);
    display:grid; place-items:center;
    box-shadow:0 12px 44px rgba(0,0,0,.55);
    transition: transform .15s ease;
  }
  #tap:active .bulat{ transform: scale(.94); }
  #tap svg{ width:40px; height:40px; margin-left:6px; fill:#111; }
  #loading{
    position:fixed; inset:0; display:grid; place-items:center; z-index:4;
    color:#9aa4b2; font-size:13px; letter-spacing:.08em; pointer-events:none;
  }
  #loading.hide{ display:none; }
</style>
</head>
<body>
  <video id="player"
         src="video.mp4"
         poster="poster.jpg"
         controls
         autoplay
         playsinline
         preload="auto"
         controlslist="nodownload"
         disablepictureinpicture></video>

  <div id="loading">MEMUATKAN VIDEO…</div>

  <button id="tap" type="button" aria-label="Main video">
    <span class="bulat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </span>
  </button>

<script>
(function(){
  var v    = document.getElementById('player'),
      tap  = document.getElementById('tap'),
      load = document.getElementById('loading');

  function mula(){
    var p = v.play();
    if (p && typeof p.then === 'function') {
      p.then(function(){ load.classList.add('hide'); })
       .catch(function(){ load.classList.add('hide'); tap.classList.add('show'); });
    }
  }

  v.addEventListener('loadeddata', function(){ load.classList.add('hide'); });
  v.addEventListener('playing',    function(){ load.classList.add('hide'); tap.classList.remove('show'); });
  v.addEventListener('waiting',    function(){ load.classList.remove('hide'); });
  v.addEventListener('canplay',    function(){ load.classList.add('hide'); });

  tap.addEventListener('click', function(){
    tap.classList.remove('show');
    v.muted = false;
    v.play().catch(function(){ v.muted = true; v.play().catch(function(){}); });
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && v.paused && !v.ended) mula();
  });

  mula();
})();
</script>
</body>
</html>
